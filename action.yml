name: 'Julia compute test matrix'
description: 'Compute a CI test matrix of Julia versions and platforms from the julia compat bound in Project.toml'
inputs:
  project-path:
    description: 'Directory containing the Project.toml (or JuliaProject.toml) whose [compat] julia bound is used'
    required: false
    default: '.'
  include-release-versions:
    description: 'Include the current Julia release version in the matrix'
    required: false
    default: true
  include-lts-versions:
    description: 'Include the current Julia LTS version in the matrix'
    required: false
    default: true
  include-all-compatible-minor-versions:
    description: 'Include the latest patch of every minor Julia version compatible with the compat bound'
    required: false
    default: false
  include-smallest-compatible-minor-versions:
    description: 'Include the smallest minor Julia version compatible with the compat bound'
    required: false
    default: true
  include-rc-versions:
    description: 'Include the rc channel (skipped if it resolves to a version already in the matrix)'
    required: false
    default: false
  include-beta-versions:
    description: 'Include the beta channel (skipped if it resolves to a version already in the matrix)'
    required: false
    default: false
  include-alpha-versions:
    description: 'Include the alpha channel (skipped if it resolves to a version already in the matrix)'
    required: false
    default: false
  include-nightly-versions:
    description: 'Include the nightly channel'
    required: false
    default: false
  include-windows-x64:
    description: 'Include Windows x64 (runs on windows-latest)'
    required: false
    default: true
  include-windows-x86:
    description: 'Include Windows x86 (runs on windows-latest)'
    required: false
    default: true
  include-linux-x64:
    description: 'Include Linux x64 (runs on ubuntu-latest)'
    required: false
    default: true
  include-linux-x86:
    description: 'Include Linux x86 (runs on ubuntu-latest)'
    required: false
    default: true
  include-macos-x64:
    description: 'Include macOS x64 (runs on macos-26-intel)'
    required: false
    default: true
  include-macos-aarch64:
    description: 'Include macOS aarch64 (runs on macos-26)'
    required: false
    default: true
  allow-failure:
    description: >-
      Comma- or newline-separated globs marking matrix legs that may fail without failing the
      workflow, matched against "<juliaup-channel>:<os>" (e.g. "rc~x64:ubuntu-latest"). Parts a
      pattern leaves out are filled in with wildcards, so "rc" covers every arch and runner and
      "*~x86" covers every 32-bit leg. Use "none" for "nothing may fail".
    required: false
    default: 'rc,beta,alpha,nightly'
outputs:
  test-matrix:
    description: >-
      JSON array of matrix entries {"os", "juliaup-channel", "experimental", "allow-failure"},
      for use with strategy.matrix.include via fromJson. "os" is a GitHub runner label,
      "juliaup-channel" is a juliaup channel of the form "<version>~<arch>" or
      "<rc|beta|alpha|nightly>~<arch>", "experimental" is true for pre-release channel entries,
      and "allow-failure" is true when the leg matched the allow-failure input — feed it to
      continue-on-error.
runs:
  using: 'node24'
  main: 'dist/index.js'
